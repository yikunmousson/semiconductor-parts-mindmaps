<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f5f1">
  <meta name="description" content="从手写笔记整理的半导体设备零部件知识图谱：ESC、材料工艺、研发流程与中英术语索引。">
  <title>半导体设备零部件 · 思维图谱</title>
  <style>
    :root {
      --ink: #183b36;
      --ink-2: #244c45;
      --text: #26312f;
      --muted: #78827d;
      --paper: #f4f5f1;
      --white: #fff;
      --line: #dfe5df;
      --mint: #dcebe3;
      --mint-dark: #648c7d;
      --orange: #c8774e;
      --orange-soft: #f7e8dc;
      --blue: #607f9c;
      --blue-soft: #e5edf4;
      --purple: #8577a1;
      --purple-soft: #eeeaf5;
      --yellow: #b58c3f;
      --yellow-soft: #f4eedc;
      --shadow: 0 16px 44px rgba(30, 53, 45, .055);
      --radius: 18px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background:
        radial-gradient(circle at 86% 0%, rgba(219, 233, 224, .58), transparent 28rem),
        var(--paper);
      color: var(--text);
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      line-height: 1.55;
    }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    a { color: inherit; }

    .app-shell { min-height: 100vh; }
    .sidebar {
      position: fixed;
      inset: 0 auto 0 0;
      z-index: 10;
      display: flex;
      width: 250px;
      flex-direction: column;
      padding: 28px 18px 22px;
      border-right: 1px solid rgba(24, 59, 54, .09);
      background: rgba(248, 249, 246, .93);
      backdrop-filter: blur(14px);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      margin: 0 8px 38px;
      color: var(--ink);
      text-decoration: none;
    }
    .brand-mark {
      display: grid;
      width: 36px;
      height: 36px;
      place-items: center;
      border-radius: 12px;
      background: var(--ink);
      color: #f9fbf9;
      font-size: 17px;
      font-weight: 750;
      letter-spacing: -.06em;
    }
    .brand-title { font-size: 13px; font-weight: 750; letter-spacing: .03em; }
    .brand-subtitle { color: var(--muted); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; }
    .nav-label {
      margin: 0 11px 10px;
      color: #9ba39e;
      font-size: 10px;
      font-weight: 750;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    .nav-list { display: grid; gap: 5px; }
    .nav-item {
      display: flex;
      width: 100%;
      align-items: center;
      gap: 11px;
      padding: 11px 12px;
      border: 0;
      border-radius: 12px;
      background: transparent;
      color: #63706b;
      text-align: left;
      transition: background .18s ease, color .18s ease, transform .18s ease;
    }
    .nav-item:hover { background: #edf1ed; color: var(--ink); }
    .nav-item[aria-current="page"] {
      background: #e2ece6;
      color: var(--ink);
      font-weight: 700;
    }
    .nav-number {
      display: grid;
      width: 25px;
      height: 25px;
      flex: 0 0 auto;
      place-items: center;
      border-radius: 8px;
      background: rgba(255, 255, 255, .74);
      color: #74827b;
      font-size: 10px;
      font-variant-numeric: tabular-nums;
    }
    .nav-item[aria-current="page"] .nav-number { background: var(--ink); color: white; }
    .nav-copy { font-size: 13px; }
    .sidebar-bottom { margin-top: auto; }
    .accent-note {
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255,255,255,.58);
    }
    .accent-note strong { display: block; color: var(--ink); font-size: 11px; }
    .accent-note span { display: block; margin-top: 4px; color: var(--muted); font-size: 10px; line-height: 1.55; }
    .sidebar-credit { margin: 13px 3px 0; color: #9aa39e; font-size: 10px; }

    .main-wrap { min-height: 100vh; margin-left: 250px; }
    .topbar {
      display: flex;
      min-height: 68px;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 0 clamp(22px, 4vw, 62px);
      border-bottom: 1px solid rgba(24, 59, 54, .07);
    }
    .crumb { color: #7a8580; font-size: 12px; }
    .crumb strong { color: var(--ink); font-weight: 700; }
    .top-actions { display: flex; align-items: center; gap: 9px; }
    .top-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255,255,255,.68);
      color: #63706b;
      font-size: 10px;
      white-space: nowrap;
    }
    .live-dot { width: 6px; height: 6px; border-radius: 50%; background: #6e9c7e; }
    .content {
      width: min(1440px, 100%);
      margin: 0 auto;
      padding: 36px clamp(22px, 4vw, 62px) 70px;
    }
    .page-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 27px;
    }
    .eyebrow {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 12px;
      color: #8a9690;
      font-size: 10px;
      font-weight: 750;
      letter-spacing: .15em;
      text-transform: uppercase;
    }
    .eyebrow-mark { width: 20px; height: 1px; background: var(--orange); }
    h1 {
      max-width: 820px;
      margin: 0;
      color: var(--ink);
      font-size: clamp(26px, 3.2vw, 42px);
      font-weight: 730;
      letter-spacing: -.045em;
      line-height: 1.2;
    }
    .page-subtitle { max-width: 700px; margin: 12px 0 0; color: #77817c; font-size: 13px; line-height: 1.75; }
    .page-counter {
      min-width: 106px;
      padding: 13px 15px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255,255,255,.5);
      text-align: right;
    }
    .page-counter strong { display: block; color: var(--ink); font-size: 20px; font-variant-numeric: tabular-nums; line-height: 1.1; }
    .page-counter span { color: #8a9690; font-size: 10px; }

    .map-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 0 0 14px;
    }
    .map-hint { color: #86918a; font-size: 11px; }
    .toolbar-actions { display: flex; gap: 7px; }
    .quiet-button {
      padding: 7px 11px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: rgba(255,255,255,.72);
      color: #5e6b64;
      font-size: 10px;
      transition: all .18s ease;
    }
    .quiet-button:hover { border-color: #b7c8bd; background: white; color: var(--ink); }

    .map-board {
      position: relative;
      overflow: hidden;
      padding: clamp(15px, 2.3vw, 30px);
      border: 1px solid rgba(24, 59, 54, .08);
      border-radius: 22px;
      background:
        radial-gradient(circle at 1px 1px, rgba(65, 105, 88, .09) 1px, transparent 1.2px) 0 0 / 22px 22px,
        rgba(255,255,255,.48);
    }
    .map-board::before {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(180deg, rgba(255,255,255,.48), transparent 170px);
      content: "";
    }
    .root-wrap { position: relative; display: flex; justify-content: center; padding-bottom: 24px; }
    .root-wrap::after {
      position: absolute;
      bottom: 0;
      left: 50%;
      height: 25px;
      border-left: 1px solid #b9c9bf;
      content: "";
    }
    .root-card {
      position: relative;
      z-index: 1;
      width: min(560px, 100%);
      padding: 19px 24px 18px;
      border: 1px solid #244d44;
      border-radius: 17px;
      background: linear-gradient(135deg, #1b4039, #28584b);
      box-shadow: 0 14px 30px rgba(26, 63, 54, .13);
      color: white;
      text-align: center;
    }
    .root-kicker { color: #b8d0c4; font-size: 9px; font-weight: 750; letter-spacing: .17em; text-transform: uppercase; }
    .root-cn { margin-top: 5px; font-size: 20px; font-weight: 750; letter-spacing: .015em; }
    .root-en { margin-top: 4px; color: #e0e9e4; font-size: 12px; }
    .root-ipa { margin-top: 5px; color: #b3c9be; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; letter-spacing: .01em; }
    .branch-grid {
      position: relative;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 13px;
    }
    .branch-grid::before {
      position: absolute;
      top: -1px;
      right: 6%;
      left: 6%;
      border-top: 1px solid #b9c9bf;
      content: "";
    }
    .branch {
      position: relative;
      z-index: 1;
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: rgba(255,255,255,.92);
      box-shadow: 0 6px 18px rgba(29, 54, 44, .035);
    }
    .branch::before {
      position: absolute;
      top: -13px;
      left: 27px;
      height: 13px;
      border-left: 1px solid #b9c9bf;
      content: "";
    }
    .branch summary { display: block; padding: 16px 16px 12px; cursor: pointer; list-style: none; }
    .branch summary::-webkit-details-marker { display: none; }
    .branch-title-row { display: flex; align-items: flex-start; gap: 10px; }
    .branch-index {
      display: grid;
      width: 25px;
      height: 25px;
      flex: 0 0 auto;
      place-items: center;
      border-radius: 8px;
      background: var(--tone-soft, var(--mint));
      color: var(--tone, var(--mint-dark));
      font-size: 10px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }
    .branch-cn { color: var(--ink); font-size: 13px; font-weight: 750; line-height: 1.35; }
    .branch-en { margin-top: 4px; color: #65746d; font-size: 10px; line-height: 1.45; }
    .branch-ipa { margin-top: 4px; color: #9aa49e; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9px; line-height: 1.5; overflow-wrap: anywhere; }
    .branch-count { margin-left: auto; color: #a0aaa4; font-size: 9px; white-space: nowrap; }
    .branch summary::after {
      display: block;
      margin: 9px 0 0 35px;
      color: #98a29c;
      font-size: 9px;
      content: "点击收起";
    }
    .branch:not([open]) summary::after { content: "点击展开"; }
    .branch-content { padding: 0 12px 13px 16px; }
    .branch-note { margin: 0 0 10px 35px; padding: 8px 9px; border-left: 2px solid var(--tone, var(--mint-dark)); background: var(--tone-soft, var(--mint)); color: #68746e; font-size: 10px; line-height: 1.6; }
    .concept-list { display: grid; gap: 7px; margin-left: 9px; padding-left: 15px; border-left: 1px solid #e4e9e5; }
    .concept-card {
      position: relative;
      min-width: 0;
      padding: 9px 10px 10px;
      border: 1px solid #edf0ec;
      border-radius: 10px;
      background: #fff;
    }
    .concept-card::before {
      position: absolute;
      top: 17px;
      left: -16px;
      width: 15px;
      border-top: 1px solid #dce4de;
      content: "";
    }
    .concept-cn { color: #2d3d36; font-size: 11px; font-weight: 720; line-height: 1.4; }
    .concept-en { margin-top: 2px; color: #64736b; font-size: 10px; line-height: 1.4; overflow-wrap: anywhere; }
    .concept-ipa { margin-top: 3px; color: #87938c; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9px; line-height: 1.45; overflow-wrap: anywhere; }
    .concept-note { margin-top: 6px; color: #8a948e; font-size: 9px; line-height: 1.55; }
    .verify-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      width: fit-content;
      margin-top: 5px;
      padding: 3px 6px;
      border: 1px solid #eddcb2;
      border-radius: 6px;
      background: #fcf6e9;
      color: #8d6b2f;
      font-size: 8px;
      line-height: 1.2;
    }
    .verify-pill::before { width: 5px; height: 5px; border-radius: 50%; background: #c69a43; content: ""; }
    .tone-orange { --tone: var(--orange); --tone-soft: var(--orange-soft); }
    .tone-blue { --tone: var(--blue); --tone-soft: var(--blue-soft); }
    .tone-purple { --tone: var(--purple); --tone-soft: var(--purple-soft); }
    .tone-yellow { --tone: var(--yellow); --tone-soft: var(--yellow-soft); }
    .tone-green { --tone: var(--mint-dark); --tone-soft: var(--mint); }

    .callout {
      display: grid;
      grid-template-columns: 28px 1fr;
      gap: 11px;
      margin-top: 17px;
      padding: 15px 17px;
      border: 1px solid #e5e8e1;
      border-radius: 14px;
      background: #fbfcf9;
    }
    .callout-mark {
      display: grid;
      width: 25px;
      height: 25px;
      place-items: center;
      border-radius: 8px;
      background: var(--yellow-soft);
      color: var(--yellow);
      font-size: 12px;
      font-weight: 800;
    }
    .callout p { margin: 1px 0 0; color: #6f7b73; font-size: 11px; line-height: 1.7; }
    .callout strong { color: #354940; }

    .flow-board { padding-bottom: 24px; }
    .flow-root { margin-bottom: 22px; }
    .flow-grid {
      position: relative;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      align-items: stretch;
    }
    .flow-stage {
      position: relative;
      min-width: 0;
      padding: 14px 12px 12px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255,255,255,.94);
    }
    .flow-stage:not(:nth-child(4n))::after {
      position: absolute;
      top: 27px;
      right: -12px;
      z-index: 2;
      width: 12px;
      color: #9bb1a4;
      font-size: 14px;
      font-weight: 600;
      text-align: center;
      content: "›";
    }
    .flow-stage-head { display: flex; gap: 8px; align-items: flex-start; padding-bottom: 10px; border-bottom: 1px solid #edf0ec; }
    .flow-stage-no { color: var(--orange); font-family: ui-monospace, monospace; font-size: 10px; font-weight: 750; }
    .flow-stage-cn { color: var(--ink); font-size: 12px; font-weight: 750; line-height: 1.35; }
    .flow-stage-en { margin-top: 3px; color: #77847c; font-size: 9px; }
    .flow-stage-ipa { margin-top: 3px; color: #9ba49e; font-family: ui-monospace, monospace; font-size: 8px; line-height: 1.5; overflow-wrap: anywhere; }
    .flow-stage .concept-list { gap: 6px; margin: 10px 0 0; padding-left: 10px; }
    .flow-stage .concept-card { padding: 8px 8px 9px; }
    .flow-stage .concept-card::before { top: 14px; left: -11px; width: 10px; }
    .flow-stage .concept-cn { font-size: 10px; }
    .flow-stage .concept-en { font-size: 9px; }
    .flow-stage .concept-ipa { font-size: 8px; }
    .flow-loop {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 13px 0 0;
      color: #8a9690;
      font-size: 10px;
    }
    .loop-line { width: 28px; height: 1px; background: #bbcac0; }

    .index-panel {
      border: 1px solid rgba(24,59,54,.08);
      border-radius: 19px;
      background: rgba(255,255,255,.78);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .index-tools { padding: 19px; border-bottom: 1px solid #e8ece8; }
    .search-row { display: flex; align-items: center; gap: 10px; }
    .search-box {
      display: flex;
      min-height: 44px;
      flex: 1;
      align-items: center;
      gap: 9px;
      padding: 0 13px;
      border: 1px solid #dce4de;
      border-radius: 11px;
      background: white;
    }
    .search-icon { color: #8c9992; font-size: 16px; }
    .search-box input { width: 100%; border: 0; outline: 0; background: transparent; color: var(--text); font-size: 12px; }
    .search-box input::placeholder { color: #a1aaa5; }
    .result-count { color: #7e8982; font-size: 10px; white-space: nowrap; }
    .filter-row { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 13px; }
    .filter-chip {
      padding: 6px 10px;
      border: 1px solid #e2e8e2;
      border-radius: 999px;
      background: transparent;
      color: #748078;
      font-size: 10px;
    }
    .filter-chip[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: white; }
    .term-list { display: grid; }
    .term-row {
      display: grid;
      grid-template-columns: minmax(140px, 1.05fr) minmax(160px, 1.2fr) minmax(180px, 1.5fr) minmax(80px, .8fr);
      align-items: center;
      gap: 12px;
      padding: 13px 20px;
      border-bottom: 1px solid #edf0ec;
    }
    .term-row:last-child { border-bottom: 0; }
    .term-cn { color: #304139; font-size: 11px; font-weight: 700; }
    .term-en { color: #66746d; font-size: 10px; overflow-wrap: anywhere; }
    .term-ipa { color: #53675d; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; overflow-wrap: anywhere; }
    .term-tag-list { display: flex; flex-wrap: wrap; gap: 4px; }
    .term-tag { padding: 3px 6px; border-radius: 5px; background: #f0f3ef; color: #839087; font-size: 8px; white-space: nowrap; }
    .term-status { color: #9b7738; font-size: 9px; }
    .empty-state { padding: 36px 18px; color: #86918a; font-size: 12px; text-align: center; }
    .index-footnote { padding: 13px 20px 17px; border-top: 1px solid #edf0ec; color: #8c9790; font-size: 10px; line-height: 1.6; }
    .index-footnote strong { color: #586860; }

    .source-panel { margin-top: 22px; padding: 18px 20px; border: 1px solid rgba(24,59,54,.08); border-radius: 16px; background: rgba(255,255,255,.55); }
    .source-head { display: flex; align-items: baseline; gap: 9px; margin-bottom: 12px; }
    .source-head strong { color: var(--ink); font-size: 12px; }
    .source-head span { color: #9aa49e; font-size: 9px; letter-spacing: .1em; text-transform: uppercase; }
    .source-links { display: flex; flex-wrap: wrap; gap: 8px; }
    .source-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 9px;
      border: 1px solid #e3e9e4;
      border-radius: 8px;
      background: rgba(255,255,255,.8);
      color: #607169;
      font-size: 9px;
      text-decoration: none;
      transition: border .18s ease, color .18s ease;
    }
    .source-link:hover { border-color: #b7c9bd; color: var(--ink); }
    .source-link::after { color: #9da9a2; content: "↗"; }
    .source-note { margin: 10px 0 0; color: #909b94; font-size: 9px; line-height: 1.6; }
    .footer { display: flex; justify-content: space-between; gap: 14px; margin-top: 24px; color: #9ba49e; font-size: 9px; }

    @media (max-width: 1120px) {
      .sidebar { width: 220px; }
      .main-wrap { margin-left: 220px; }
      .branch-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .flow-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .flow-stage:not(:nth-child(4n))::after { display: none; }
      .flow-stage:not(:nth-child(2n))::after { display: block; }
      .flow-stage:nth-child(2n)::after { content: "↓"; top: auto; right: 50%; bottom: -15px; }
    }
    @media (max-width: 760px) {
      .sidebar {
        position: sticky;
        inset: 0 0 auto;
        width: auto;
        height: auto;
        padding: 11px 14px 10px;
        border-right: 0;
        border-bottom: 1px solid rgba(24,59,54,.09);
      }
      .brand { margin: 0 0 10px; }
      .brand-mark { width: 30px; height: 30px; border-radius: 9px; font-size: 14px; }
      .brand-title { font-size: 12px; }
      .brand-subtitle { font-size: 8px; }
      .nav-label, .sidebar-bottom { display: none; }
      .nav-list { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 1px; scrollbar-width: none; }
      .nav-list::-webkit-scrollbar { display: none; }
      .nav-item { width: auto; min-width: max-content; gap: 0; padding: 7px 5px; border-radius: 8px; }
      .nav-number { display: none; }
      .nav-copy { font-size: 9px; }
      .main-wrap { margin-left: 0; }
      .topbar { min-height: 48px; padding: 0 17px; }
      .crumb { font-size: 10px; }
      .top-pill { padding: 6px 8px; font-size: 9px; }
      .content { padding: 25px 15px 46px; }
      .page-head { align-items: flex-start; margin-bottom: 19px; }
      h1 { font-size: 27px; }
      .page-subtitle { margin-top: 9px; font-size: 11px; }
      .page-counter { min-width: 68px; padding: 9px; }
      .page-counter strong { font-size: 16px; }
      .page-counter span { font-size: 8px; }
      .eyebrow { margin-bottom: 9px; font-size: 9px; }
      .map-toolbar { align-items: flex-start; flex-direction: column; }
      .toolbar-actions { width: 100%; justify-content: flex-end; }
      .map-board { padding: 12px; border-radius: 16px; }
      .root-card { padding: 15px 12px 14px; border-radius: 13px; }
      .root-cn { font-size: 16px; }
      .root-en { font-size: 10px; }

    function allTerms() {
      const entries = [];
      const seen = new Map();
      maps.forEach(function (map) {
        const source = [];
        function collect(node, kind) {
          source.push(Object.assign({}, node, { kind: kind }));
          (node.items || []).forEach(function (child) { collect(child, "item"); });
        }
        collect(map.root, "root");
        map.groups.forEach(function (group) { collect(group, "group"); });
        source.forEach(function (term) {
          const key = (term.cn || "") + "|" + (term.en || "");
          if (seen.has(key)) {
            const existing = entries[seen.get(key)];
            if (existing.maps.indexOf(map.id) === -1) existing.maps.push(map.id);
            if (!existing.ipa && term.ipa) existing.ipa = term.ipa;
            if (!existing.status && term.status) existing.status = term.status;
          } else {
            const clone = Object.assign({}, term, { maps: [map.id] });
            seen.set(key, entries.length);
            entries.push(clone);
          }
        });
      });
      uncertainTerms.forEach(function (term) {
        const key = term.cn + "|" + term.en;
        if (!seen.has(key)) {
          const clone = Object.assign({}, term, { maps: [term.mapId], kind: "note" });
          seen.set(key, entries.length);
          entries.push(clone);
        }
      });
      return entries.sort(function (a, b) {
        if (!!a.status !== !!b.status) return a.status ? 1 : -1;
        return a.cn.localeCompare(b.cn, "zh-CN");
      });
    }

    function renderUncertain(map) {
      if (!map.uncertain || !map.uncertain.length) return null;
      const wrapper = make("section", "source-panel");
      const header = make("div", "source-head");
      header.appendChild(make("strong", "", "手稿待核项"));
      header.appendChild(make("span", "", "Kept for verification"));
      wrapper.appendChild(header);
      const list = make("div", "branch-grid");
      map.uncertain.forEach(function (term) {
        const card = make("div", "concept-card");
        card.appendChild(make("div", "concept-cn", term.cn));
        card.appendChild(make("div", "concept-en", term.en));
        card.appendChild(make("div", "verify-pill", term.status));
        card.appendChild(make("div", "concept-note", term.note));
        list.appendChild(card);
      });
      wrapper.appendChild(list);
      return wrapper;
    }

    function sourcePanel() {
      const panel = make("section", "source-panel");
      const head = make("div", "source-head");
      head.appendChild(make("strong", "", "参考资料"));
      head.appendChild(make("span", "", "Pronunciation & technical notes"));
      panel.appendChild(head);
      const links = make("div", "source-links");
      const sources = [
        ["NGK · Electrostatic chucks", "https://www.ngk-global.com/product/sc-chack.html"],
        ["JFM · Back-side gas cooling", "https://www.jfm-kk.jp/en/industry/new-electrostatic-chucks-for-semiconductor-wafer-processing"],
        ["Cambridge · electrostatic", "https://dictionary.cambridge.org/pronunciation/english/electrostatic"],
        ["Cambridge · bipolar", "https://dictionary.cambridge.org/pronunciation/english/bipolar"],
        ["Cambridge · dielectric", "https://dictionary.cambridge.org/pronunciation/english/dielectric"],
        ["Cambridge · wafer", "https://dictionary.cambridge.org/pronunciation/english/wafer"],
        ["Cambridge · heater", "https://dictionary.cambridge.org/pronunciation/english/heater"],
        ["Cambridge · anodize", "https://dictionary.cambridge.org/pronunciation/english/anodize"],
        ["Cambridge · machining", "https://dictionary.cambridge.org/pronunciation/english/machining"],
        ["Cambridge · purity", "https://dictionary.cambridge.org/pronunciation/english/purity"],
        ["Cambridge · temperature", "https://dictionary.cambridge.org/pronunciation/english/temperature"],
        ["Cambridge · excitation", "https://dictionary.cambridge.org/pronunciation/english/excitation"],
        ["Cambridge · coupling", "https://dictionary.cambridge.org/pronunciation/english/coupling"],
        ["Cambridge · electrode", "https://dictionary.cambridge.org/pronunciation/english/electrode"],
        ["Cambridge · showerhead", "https://dictionary.cambridge.org/pronunciation/english/showerhead"],
        ["Cambridge · insulate", "https://dictionary.cambridge.org/pronunciation/english/insulate"],
        ["Cambridge · Coulomb", "https://dictionary.cambridge.org/pronunciation/english/coulomb"],
        ["Collins · thermocouple", "https://www.collinsdictionary.com/dictionary/english/thermocouple"],
        ["Collins · Coulombic (BrE)", "https://www.collinsdictionary.com/us/dictionary/english/coulombic"]
      ];
      panel.appendChild(links);
      sources.forEach(function (source) {
        const link = make("a", "source-link", source[0]);
        link.href = source[1];
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        links.appendChild(link);
      });
      const note = make("p", "source-note", "术语解释用于辅助阅读；产品规格请以原厂图纸或客户规范为准。流程专题依据手写关键词重组。IPA 默认采用美式英语词典发音；Coulombic 明示英式变体。");
      panel.appendChild(note);
      return panel;
    }

    function renderMap(id) {
      const map = mapFor(id);
      crumb.textContent = map.nav;
      main.replaceChildren();
      function countNode(node) { return 1 + (node.items || []).reduce(function (sum, child) { return sum + countNode(child); }, 0); }
      const count = 1 + map.groups.reduce(function (sum, group) { return sum + countNode(group); }, 0);
      main.appendChild(pageHead(map.kicker, map.title, map.subtitle, count, "图谱节点"));
      if (map.layout === "flow") main.appendChild(mapToolbar());
      main.appendChild(map.layout === "flow" ? renderFlow(map) : renderTree(map));
      main.appendChild(renderNotes(map.notes));
      const uncertain = renderUncertain(map);
      if (uncertain) main.appendChild(uncertain);
      main.appendChild(sourcePanel());
      main.appendChild(footer());
    }

    function footer() {
      const item = make("footer", "footer");
      item.appendChild(make("span", "", "半导体设备零部件 · 学习型思维图谱"));
      item.appendChild(make("span", "", "依据手稿整理 · 术语可搜索 · 待核项已标记"));
      return item;
    }

    function renderIndex() {
      crumb.textContent = "术语索引";
      main.replaceChildren();
      main.appendChild(pageHead("05 · TERM INDEX", "术语索引", "按中文、英文或 IPA 搜索。点击专题标签缩小范围；不确定缩写与专名集中列在末尾，并保留待核标记。", terms.length, "条目"));

      const panel = make("section", "index-panel");
      const tools = make("div", "index-tools");
      const searchRow = make("div", "search-row");
      const search = make("label", "search-box");
      search.setAttribute("aria-label", "搜索中英文术语或 IPA");
      search.appendChild(make("span", "search-icon", "⌕"));
      const input = document.createElement("input");
      input.type = "search";
      input.placeholder = "搜索中文、英文、缩写或音标…";
      input.value = indexQuery;
      input.addEventListener("input", function () {
        indexQuery = input.value.trim().toLowerCase();
        renderTerms(list, count);
      });
      search.appendChild(input);
      searchRow.appendChild(search);
      const count = make("span", "result-count");
      searchRow.appendChild(count);
      tools.appendChild(searchRow);

      const filters = make("div", "filter-row");
      const options = [{ id: "all", label: "全部" }].concat(maps.map(function (map) { return { id: map.id, label: map.nav }; })).concat([{ id: "pending", label: "待核实" }]);
      options.forEach(function (option) {
        const button = make("button", "filter-chip", option.label);
        button.type = "button";
        button.setAttribute("aria-pressed", option.id === indexFilter ? "true" : "false");
        button.addEventListener("click", function () {
          indexFilter = option.id;
          filters.querySelectorAll("button").forEach(function (element) {
            element.setAttribute("aria-pressed", element.textContent === option.label ? "true" : "false");
          });
          renderTerms(list, count);
        });
        filters.appendChild(button);
      });
      tools.appendChild(filters);
      panel.appendChild(tools);
      const list = make("div", "term-list");
      panel.appendChild(list);
      const footnote = make("div", "index-footnote");
      footnote.innerHTML = "<strong>标注规则：</strong>美式 IPA 为默认；缩写、型号或专名不能可靠确认时显示“待核实”，不补猜测读音。字母缩写只在确有把握按字母名读出时单独标出。";
      panel.appendChild(footnote);
      main.appendChild(panel);
      main.appendChild(sourcePanel());
      main.appendChild(footer());
      renderTerms(list, count);
    }

    function renderTerms(list, count) {
      const q = indexQuery;
      const shown = terms.filter(function (term) {
        const inFilter = indexFilter === "all" ||
          (indexFilter === "pending" ? !!term.status : term.maps.indexOf(indexFilter) !== -1);
        const haystack = [term.cn, term.en, term.ipa, term.status, term.note].join(" ").toLowerCase();
        return inFilter && (!q || haystack.indexOf(q) !== -1);
      });
      count.textContent = "显示 " + shown.length + " / " + terms.length + " 项";
      list.replaceChildren();
      if (!shown.length) {
        list.appendChild(make("div", "empty-state", "没有找到匹配术语。试试更短的词或清除筛选。"));
        return;
      }
      shown.forEach(function (term) {
        const row = make("div", "term-row");
        row.appendChild(make("div", "term-cn", term.cn));
        row.appendChild(make("div", "term-en", term.en));
        row.appendChild(make("div", term.status ? "term-status" : "term-ipa", term.ipa || term.status));
        const tags = make("div", "term-tag-list");
        term.maps.forEach(function (id) {
          const map = mapFor(id);
          if (map) tags.appendChild(make("span", "term-tag", map.nav));
        });
        row.appendChild(tags);
        if (term.note) row.title = term.note;
        list.appendChild(row);
      });
    }

    function navigate(id) {
      activeId = id;
      nav.querySelectorAll(".nav-item").forEach(function (button) {
        button.setAttribute("aria-current", button.dataset.view === id ? "page" : "false");
      });
      if (id === "index") renderIndex();
      else renderMap(id);
      const hash = id === "overview" ? "" : "#" + id;
      if (window.location.hash !== hash) history.replaceState(null, "", hash || window.location.pathname);
      if (window.innerWidth <= 760) window.scrollTo({ top: 0, behavior: "smooth" });
    }

    renderNav();
    window.addEventListener("hashchange", function () {
      const requested = window.location.hash.slice(1);
      if (requested === "index" || mapFor(requested)) {
        navigate(requested);
      } else {
        navigate("overview");
      }
    });
    const initial = window.location.hash.slice(1);
    if (initial === "index") navigate("index");
    else if (mapFor(initial)) navigate(initial);
    else renderMap("overview");
  </script>
</body>
</html>
